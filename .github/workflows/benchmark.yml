name: Benchmark search quality

# §5.7.8 Spec 3 — automatic regression detection for the search path.
#
# Threshold mapping (Spec §1.3 + Finding 4 master decision):
#   - Baseline (filter OFF, layer 0)        — Top-1 ≥ 0.6  / Top-3 ≥ 0.85 / MRR ≥ 0.80
#                                              Protects against legacy-path regressions while
#                                              the augmented path is still being measured.
#   - Augmented (filter+rewrite+expand)     — Top-1 ≥ 0.70 / Top-3 ≥ 0.88 / MRR ≥ 0.85
#                                              Spec target. Currently a manual / scheduled
#                                              run because CI cannot make deterministic LLM
#                                              calls without an API key + reproducible
#                                              fixture; tracking issue: §5.7.8 follow-up.
#
# Karpathy #2 simplicity — CI auto-runs only the baseline path so PRs always have a green
# regression gate. The augmented run is comment-driven (`/benchmark-augmented`) once a
# layer-injected harness lands. See `wikey-core/src/scripts/benchmark-search.ts`.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wikey-core/package-lock.json

      - name: Install dependencies (wikey-core)
        working-directory: wikey-core
        run: npm ci || npm install

      - name: Build wikey-core
        working-directory: wikey-core
        run: npm run build

      - name: Run baseline benchmark (filter OFF)
        id: benchmark
        working-directory: wikey-core
        env:
          # §5.7.8 Finding 4 — baseline thresholds (filter OFF). Augmented run gates are
          # tighter (0.70 / 0.88 / 0.85) and live on the manual trigger.
          WIKEY_BENCHMARK_TOP1_MIN: '0.6'
          WIKEY_BENCHMARK_TOP3_MIN: '0.85'
          WIKEY_BENCHMARK_MRR_MIN: '0.80'
        run: |
          set -o pipefail
          npm run benchmark:search 2>&1 | tee /tmp/benchmark-output.txt

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            let body = '## Benchmark search quality (baseline, filter OFF)\n\n';
            body += '**Thresholds**: Top-1 ≥ 0.6 / Top-3 ≥ 0.85 / MRR ≥ 0.80 — Spec §5.7.8 §1.3 baseline mapping.\n\n';
            body += 'The augmented (filter+rewrite+expand) run is currently manual; see workflow comments.\n\n';
            try {
              const out = fs.readFileSync('/tmp/benchmark-output.txt', 'utf-8');
              body += '```\n' + out.slice(-3000) + '\n```\n';
            } catch {
              body += '_(benchmark output not available — workflow failed before run)_\n';
            }
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
